name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  full:
    name: All tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: Bundle is up to date
        run: |
          python scripts/build_bundle.py /tmp/hpcflow.py
          diff -q /tmp/hpcflow.py dist/hpcflow.py
      - name: Tests
        run: python -m pytest -q

  old-python:
    # Clusters often run old system Pythons: run the engine, CLI and cluster bundle on the oldest
    # Python that GitHub's runners still provide (the web app and its tests need Python 3.12).
    name: Cluster tool on Python 3.8
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Install
        run: pip install pytest
      - name: Tests (no web app, no timing limits)
        run: >
          python -m pytest -q
          --ignore=tests/test_api.py
          --ignore=tests/test_performance.py
          --deselect tests/test_warnings_ui.py::test_api_returns_warnings
      - name: Cluster bundle runs
        run: |
          python dist/hpcflow.py data/example_sacct.txt --top 2
          python dist/hpcflow.py data/example_sacct.txt --json > /dev/null
